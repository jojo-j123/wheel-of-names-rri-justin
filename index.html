<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/brand/rri-logo.jpeg" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0C0C" />
    <meta name="description" content="RRI Event Wheel — live prize draws for events." />
    <title>RRI Event Wheel</title>
    <script>
      // Apply the saved appearance before first paint (no flash of the wrong theme).
      try {
        var a = localStorage.getItem('rri-appearance')
        if (a === 'dark' || (a !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
